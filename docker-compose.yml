services:
  app:
    build: .
    container_name: ottodot-app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # Healthy once dependencies are installed and the web server accepts connections.
      test: ["CMD-SHELL", "test -f vendor/autoload.php && php -r 'exit(@fsockopen(\"127.0.0.1\", 8000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  node:
    image: node:24-alpine
    container_name: ottodot-node
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /var/www/html
    environment:
      HOME: /tmp   # writable npm cache for the non-root host user
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"   # Vite dev server (assets + HMR for the React app)
    volumes:
      - .:/var/www/html
    healthcheck:
      # Healthy once Vite serves its client, so `docker compose up --wait` blocks until assets load.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/@vite/client"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  mysql:
    image: mysql:8.4
    container_name: ottodot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ottodot
      MYSQL_USER: ottodot
      MYSQL_PASSWORD: secret
    ports:
      - "${DB_HOST_PORT:-3307}:3306"   # host port for DB GUI tools; the app uses mysql:3306 internally
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Uses TCP + the test DB, so it only passes after the init scripts have finished
      # (MySQL's temporary init server does not listen on TCP).
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uottodot -psecret -e 'SELECT 1' ottodot_test"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
